<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neuromuscular junction: whiteboard illustration (no labels)</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#e6e5df}
#s{user-select:none;-webkit-user-select:none;display:block;width:100%;height:100%;background:#fbfbf7}
text{font-family:"Segoe Print","Bradley Hand","Marker Felt","Chalkboard SE","Comic Sans MS",cursive;font-size:16px;fill:#222}
.b{fill:#2a5fd0}.r{fill:#d9253a}.g{fill:#1b8a5a}.p{fill:#6a3fb5}.t{fill:#0e8f80}.k{fill:#222}.pk{fill:#c02b8a}
#vmGraph text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
.ld{stroke:#888;stroke-width:1.3;fill:none}
#hdr{position:fixed;top:10px;left:12px;z-index:3;max-width:calc(60vw - 40px);padding:8px 16px 9px;background:rgba(255,255,255,.95);border:1.5px solid #b9b9b9;border-radius:12px;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.1);pointer-events:none}
#hdr .h1{font-size:22px;font-weight:700;color:#1b1b1b;letter-spacing:.01em}
#hdr .h2{font-size:13px;color:#555;margin-top:1px}
#panel{position:fixed;top:10px;right:10px;width:min(40vw,720px);z-index:3;filter:drop-shadow(0 2px 6px rgba(0,0,0,.12))}
#vmSvg{display:block;width:100%;height:auto}
#tnSvg{display:block;width:100%;height:auto;margin-top:8px}
#vmGraph2 text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
#hud .hb{font-size:12px;font-weight:700}
#hud{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#hud text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
#hud .hl{font-size:15px;font-weight:600;fill:#1b1b1b}
#hud .hc1{font-size:19px;font-weight:700;fill:#1b1b1b;stroke:none}
#hud .hc2{font-size:15px;fill:#444;stroke:none}
#hud .ht{font-size:14px;font-weight:700;fill:#fff;stroke:none}
#hud .c-done{fill:#e3f3ea;stroke:#8cc9a6}#hud .c-now{fill:#262626;stroke:#ff9500;stroke-width:2}#hud .c-next{fill:#f1f1f1;stroke:#ddd}
#hud .ct-done,#hud .ct-now,#hud .ct-next,#hud .ca{font-size:11.5px;stroke:none}#hud .ct-done{fill:#1b6b43}#hud .ct-now{fill:#fff;font-weight:700}#hud .ct-next{fill:#888}#hud .ca{fill:#999;font-size:15px}
</style></head><body>
<svg id="s" viewBox="0 0 1760 990" preserveAspectRatio="xMinYMin meet" role="img" aria-label="Whiteboard-style diagram of a neuromuscular junction, T-tubule, sarcoplasmic reticulum and sarcomeres">
<defs>
<filter id="w" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
</defs>
<g id="art" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#w)"></g>
</svg>
<svg id="hud" aria-hidden="true"></svg>
<div id="hdr"><div class="h1">Muscle Twitch Cycle</div></div>
<div id="panel"><svg id="vmSvg" viewBox="1046 8 704 346"></svg><svg id="tnSvg" viewBox="0 0 704 200"></svg></div>
<script>
const T='#19b3a0',R='#d9253a',B='#2a5fd0',LB='#3b8de0',P='#6a3fb5',G='#2fae6b',PK='#d63a9a',RD='#d61f1f';
let h='';const A=s=>h+=`<g id="${s[0]}">${s[1]}</g>`;
const dots=[[-8,-6],[0,-11],[9,-5],[-5,3],[6,6],[0,11],[-11,8],[12,3]];
const ves=(x,y,r=22)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${T}" stroke-width="3"/>`+dots.map(d=>`<circle cx="${x+d[0]*r/24}" cy="${y+d[1]*r/24}" r="1.8" fill="#111" stroke="none"/>`).join('');
const mito=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="38" ry="20" fill="#fff" stroke="#333" stroke-width="2.5"/>`+[-22,-9,4,17].map((d,i)=>`<path d="M${x+d},${y-(i%2?-18:18)}V${y+(i%2?2:-2)}" stroke="#333" stroke-width="2"/>`).join('');

/* NEURON */
let n=`<path d="M0,45H400M0,95H300"/><path d="M300,95C300,60 340,45 400,45H880C990,45 1030,120 1030,190C1030,280 990,300 930,300H390C330,300 300,240 300,95" stroke="${T}" stroke-width="5"/>`;
n+=`<path d="M0,45H400M0,95H300" stroke="${T}" stroke-width="5"/>`;
n+=[20,150].map(x=>`<rect x="${x}" y="32" width="110" height="13" rx="6" fill="#111"/><rect x="${x}" y="95" width="110" height="13" rx="6" fill="#111"/>`).join('');
n+=mito(405,125)+mito(495,92);
const pool=[[470,215],[545,150],[605,222],[700,165],[780,215],[640,108],[860,135],[940,205],[780,120]];
n+=`<path d="M470,215L545,150L640,108L700,165L780,120L860,135M700,165L690,242M605,222L668,262M780,215L825,248" stroke="#e08a2b" stroke-width="2" stroke-dasharray="2 5"/>`;
n+=pool.map(p=>ves(p[0],p[1])).join('');
for(const x of[470,498])n+=`<rect x="${x-6}" y="287" width="12" height="26" rx="5" fill="#fff" stroke="${B}"/>`;
n+=`<rect x="400" y="286" width="20" height="28" rx="3" fill="#fff" stroke="${PK}"/><path d="M404,296L416,290M404,306L416,300" stroke="${PK}" stroke-width="2"/>`;
A(['neuron',n]);

/* CLEFT */
let c='';
for(let x=330;x<=950;x+=62)c+=`<path d="M${x-6},352a7,7 0 1,1 7,5l-1,-5z" fill="#fde7c8" stroke="#e76f51" stroke-width="2"/>`;
A(['cleft',c]);

/* END PLATE */
let d='M140,985V380Q140,360 180,360H330';
for(let k=0;k<7;k++){const x=330+90*k;d+=`H${x+50}C${x+60},360 ${x+58},415 ${x+70},415C${x+82},415 ${x+80},360 ${x+90},360`}
d+='H1118V740Q1130,758 1142,740V360H1330V985';
let e=`<path d="${d}" stroke="${R}" stroke-width="5"/>`;
A(['endplate',e]);

/* T-TUBULE + SR */
let sr='';
const wav=(x0,a,ph,xe)=>{let p=`M${xe},430`;for(let y=430;y<=700;y+=5)p+=`L${x0+a*Math.sin(y/15+ph)},${y}`;return p+`L${xe},700Z`};
sr+=`<path d="${wav(1005,18,0,1096)}" fill="#eef4ff" stroke="${LB}"/><path d="${wav(1255,18,2,1164)}" fill="#eef4ff" stroke="${LB}"/>`;
let ls='';for(const o of[0,12]){ls+=`M160,${540+o}`;for(let x=160;x<=1005;x+=8)ls+=`L${x},${540+o+12*Math.sin(x/24)}`}
sr+=`<path d="${ls.split('M').filter(Boolean).map(s=>'M'+s).join('')}" stroke="${LB}" stroke-width="3"/>`;
for(const x of[240,400,560,720,880])sr+=`<path d="M${x-5},${566+12*Math.sin(x/24)}h10l-5,9z" fill="#f4a261" stroke="none"/>`;
A(['sr',sr]);

/* SARCOMERES: Z-discs + thin filaments and the thick filaments are separate groups so the timeline can slide them.
   Myosin heads, titin, tropomyosin and troponin are drawn (and moved) by the timeline. */
let s='';
const rowsT=[610,690,770,850],rowsK=[650,730,810];
const tmSides=i=>i===0?[1]:i===rowsT.length-1?[-1]:[-1,1];   // which side(s) of each thin filament face myosin
const zdisc=z=>{let p=`M${z},575`;for(let y=590;y<=890;y+=15)p+=`L${z+(((y-590)/15)%2?7:-7)},${y}`;return`<path d="${p}" stroke="${PK}" stroke-width="5"/>`};
const thinF=(a,b)=>{let t='';rowsT.forEach((y,i)=>{
 t+=`<path d="M${a},${y}H${b}" stroke="#111" stroke-width="3.5"/><path d="M${a},${y}H${b}" stroke="${B}" stroke-width="2" stroke-dasharray="2 7"/>`;
 for(let x=a+12;x<b-8;x+=24){if(i<3)t+=`<path d="M${x},${y+2}a6,7 0 0 0 12,0" stroke="${B}" stroke-width="2.5"/>`;if(i>0)t+=`<path d="M${x},${y-2}a6,7 0 0 1 12,0" stroke="${B}" stroke-width="2.5"/>`}});return t};
s+=`<g id="sgL0">${zdisc(200)}${thinF(200,340)}</g>`;                 // left Z-disc of sarcomere 1 + its thin filaments
s+=`<g id="sgM">${zdisc(520)}${thinF(380,520)}${thinF(520,660)}</g>`;  // shared middle Z-disc (stays put)
s+=`<g id="sgR1">${zdisc(840)}${thinF(700,840)}</g>`;                 // right Z-disc of sarcomere 2
for(let q=0;q<2;q++){const o=320*q,cx=360+o;let k='';
 rowsK.forEach(y=>k+=`<rect x="${265+o}" y="${y-7}" width="190" height="14" rx="7" fill="${RD}" stroke="none"/>`);
 k+=`<path d="M${cx},592V872" stroke="#999" stroke-width="1.5" stroke-dasharray="4 5"/>`;
 s+=`<g id="sgK${q}">${k}</g>`}
A(['sarcomere',s]);

/* FORCE-GENERATION PARTS: stored Ca²⁺, muscle mitochondria (tropomyosin/troponin are drawn by the timeline) */
const CA='#ffc21a',CAS='#a66a00';
const ca=(x,y,r=3.4)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${CA}" stroke="${CAS}" stroke-width="1.3"/>`;
let f='';
// Ca²⁺ stored in the terminal cisternae of the SR
const rs=rnd=>{let s=rnd;return()=>(s=(s*16807)%2147483647)/2147483647};const r1=rs(7);
// Ca²⁺ stored in the SR: positions only; the timeline draws (and later releases) them
const SRCA=[];for(let i=0;i<16;i++){SRCA.push([1036+r1()*48,450+r1()*230]);SRCA.push([1178+r1()*46,450+r1()*230])}
// mitochondria in the muscle fibre (ATP for cross-bridge cycling and SERCA)
f+=mito(935,780)+mito(935,870)+mito(700,488);
A(['force',f]);
document.getElementById('art').innerHTML=h;

/* ================= INTERACTIVE TIMELINE: graph + slider drive a camera that follows the ions ================= */
(()=>{
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('s'),$=id=>document.getElementById(id);
const sm=u=>u<=0?0:u>=1?1:u*u*(3-2*u),lerp=(a,b,u)=>a+(b-a)*u,clamp01=u=>u<0?0:u>1?1:u;
const win=(t,a,b,f=.012)=>sm((t-a)/f)*(1-sm((t-b)/f));   // 0→1 fade in at a, 1→0 fade out at b
const T0=0,T1=12,VMAX=40,VMIN=-100,RMP=-90,NRMP=-70,THR=-55;

/* ---------- membrane potentials (illustrative) ---------- */
// muscle fibre: rest, end-plate potential, upstroke, repolarisation, after-hyperpolarisation
function Vm(t){
 if(t<1)return RMP;
 if(t<1.8)return RMP+(THR-RMP)*(1-Math.exp(-(t-1)/.35))/(1-Math.exp(-.8/.35));
 if(t<2.3){const u=(t-1.8)/.5;return THR+(30-THR)*(1-Math.pow(1-u,3))}
 if(t<3.8)return 30-125*sm((t-2.3)/1.5);
 return -95+5*(1-Math.exp(-(t-3.8)/.8))}
// motor axon terminal: the action potential arrives and invades the terminal
function Vn(t){
 if(t<.24)return NRMP;
 if(t<.33)return NRMP+(THR-NRMP)*(1-Math.exp(-(t-.24)/.04))/(1-Math.exp(-.09/.04));
 if(t<.42){const u=(t-.33)/.09;return THR+(35-THR)*(1-Math.pow(1-u,3))}
 if(t<.75)return 35-113*sm((t-.42)/.33);
 return -78+8*(1-Math.exp(-(t-.75)/.25))}
// story text for each moment: [heading, explanation]
function phase(t){
 if(t<.05)return['At rest','The inside of each cell is negative (neuron −70 mV, muscle −90 mV). Na⁺ and Ca²⁺ are concentrated outside.'];
 if(t<.12)return['An action potential arrives','An action potential is a brief, travelling reversal of the membrane voltage: the inside flips from negative to positive.'];
 if(t<.20)return['Node of Ranvier: Na⁺ rushes in','Voltage-gated Na⁺ channels open. Na⁺ floods in and makes the inside positive: this is the action potential.'];
 if(t<.24)return['Saltatory conduction','The positive charge spreads inside the axon, under the insulating myelin, to the next node.'];
 if(t<.31)return['Last node: Na⁺ rushes in again','More Na⁺ channels open, regenerating the action potential at full size.'];
 if(t<.38)return['The action potential invades the terminal','The depolarisation spreads through the presynaptic terminal (inside turns positive).'];
 if(t<.46)return['Ca²⁺ channels open','The depolarisation opens voltage-gated Ca²⁺ channels in the presynaptic membrane.'];
 if(t<.58)return['Ca²⁺ rushes in','Ca²⁺ flows down its steep gradient into the terminal and binds the Ca²⁺ sensor (synaptotagmin) on docked vesicles.'];
 if(t<.72)return['Exocytosis: ACh is released','SNARE proteins zip the vesicles into the membrane; the vesicles open and ACh spills into the cleft.'];
 if(t<.92)return['ACh crosses the synaptic cleft','ACh diffuses about 50 nm to the end plate. Acetylcholinesterase in the cleft breaks some of it down.'];
 if(t<1.0)return['ACh binds nicotinic receptors','Two ACh molecules bind each nicotinic receptor, which opens its cation pore.'];
 if(t<1.8)return['Na⁺ flows into the muscle: end-plate potential','Na⁺ floods in (and a little K⁺ leaks out) through the open receptors, depolarising the muscle towards threshold.'];
 if(t<2.2)return['Muscle action potential fires','The end-plate potential reaches threshold and opens voltage-gated Na⁺ channels; Na⁺ rushes into the muscle fibre.'];
 if(t<2.5)return['The action potential spreads','It races along the sarcolemma in both directions, away from the end plate.'];
 if(t<2.75)return['Down the T-tubule','T-tubules carry the action potential deep into the fibre, right next to the sarcoplasmic reticulum (SR).'];
 if(t<3.05)return['DHPR senses the voltage','The voltage sensor (DHPR) in the T-tubule changes shape and mechanically pulls open the ryanodine receptor (RyR) on the SR.'];
 if(t<3.9)return['Ca²⁺ is released from the SR','Ca²⁺ pours out of the SR through the open RyRs into the cytoplasm around the myofibrils.'];
 if(t<4.55)return['Ca²⁺ diffuses to the myofilaments','Ca²⁺ released from the SR spreads through the cytoplasm to the thin (actin) filaments.'];
 if(t<4.95)return['Ca²⁺ binds troponin','Ca²⁺ binds troponin C on the thin filaments, all along the fibre (Ca²⁺ arrives from every triad).'];
 if(t<5.3)return['Tropomyosin moves aside','Ca²⁺-bound troponin changes shape and drags tropomyosin off the myosin-binding sites on actin.'];
 if(t<5.41)return['A cross-bridge forms','The myosin head, already cocked and holding ADP + Pi, binds to the exposed site on actin.'];
 if(t<5.63)return['Power stroke','Pi is released and the head swings, pulling the thin filament toward the M-line; then ADP is released.'];
 if(t<5.74)return['ATP releases the head','A fresh ATP binds the myosin head, which lets go of actin.'];
 if(t<6.75)return['Head re-cocks: the cycle repeats','Myosin splits ATP into ADP + Pi, which re-cocks the head so it can bind further along the actin.'];
 if(t<9.0)return['Sliding filaments: the sarcomere shortens','Thousands of heads cycling out of step slide the thin filaments toward the M-line. Z-discs move closer and the muscle pulls.'];
 if(t<9.65)return['SERCA pumps Ca²⁺ back into the SR','With no new impulse, SERCA pumps (using ATP) move Ca²⁺ from the cytoplasm back into the SR.'];
 if(t<10.05)return['Tropomyosin blocks actin again','Ca²⁺ leaves troponin; tropomyosin slides back over the binding sites, so heads can no longer attach.'];
 if(t<11.6)return['Relaxation','Heads stay detached (cocked, ready). Titin and the fibre’s elasticity return the sarcomere to its resting length.'];
 return['Back at rest','Everything is reset and ready for the next nerve impulse.']}
// cause → effect chain shown in the caption (start time, short label)
const CHAIN=[[.05,'AP travels down axon'],[.12,'AP opens Na⁺ gates'],[.37,'AP opens Ca²⁺ gates'],[.46,'Ca²⁺ triggers ACh release'],[.72,'ACh crosses cleft'],
 [.95,'ACh opens muscle gates'],[1.0,'Na⁺ in: end-plate potential'],[1.8,'Na⁺ gates: muscle AP'],[2.2,'AP down T-tubule'],[2.75,'DHPR pulls RyR open'],[3.05,'Ca²⁺ out of SR'],
 [4.55,'Ca²⁺ binds troponin'],[4.95,'Tropomyosin moves aside'],[5.3,'Cross-bridges form'],[5.41,'Power stroke'],[5.63,'ATP: detach & re-cock'],[6.75,'Sarcomere shortens'],[9.0,'SERCA pumps Ca²⁺ back'],[10.05,'Relaxation']];
const wrap=(s,n)=>{const out=[];let line='';for(const w of s.split(' ')){if(line&&(line+' '+w).length>n){out.push(line);line=w}else line=line?line+' '+w:w}if(line)out.push(line);return out};

/* ---------- slider → time warp: slow where things happen, fast after hyperpolarisation ---------- */
function dens(t){if(t<.05)return 6;if(t<1)return 16;if(t<3.9)return 3;if(t>=5.25&&t<6.75){const f=((t-5.3)/.72)%1;return t>=5.3&&f>=.45?2.5:10}if(t<6.75)return 7;if(t<11.9)return 2.5;return 1}
const WT=[],WS=[];{let s=0;for(let i=0;i<=T1/.002+.5;i++){const t=i*.002;WT.push(t);WS.push(s);s+=dens(t)*.002}}
const SMAX=8000,STOT=WS[WS.length-1];
function s2t(v){const g=v/SMAX*STOT;let lo=0,hi=WS.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(WS[m]<=g)lo=m;else hi=m}
 return lerp(WT[lo],WT[hi],(g-WS[lo])/((WS[hi]-WS[lo])||1))}

/* ---------- graph panel (fixed overlay, does not zoom with the diagram) ---------- */
const X0=1122,X1=1500,Y0=66,Y1=262,SX0=1068,SX1=1728,PX=1046,PY=8,PW=704,PH=346,IX=1526;
const px=t=>X0+(t-T0)/(T1-T0)*(X1-X0),py=v=>Y0+(VMAX-v)/(VMAX-VMIN)*(Y1-Y0);
const mv=v=>(v<0?'−':v>0?'+':'')+Math.abs(Math.round(v));
const ptsM=[],ptsN=[];for(let t=T0;t<=T1+1e-9;t+=.005){ptsM.push([t,Vm(t)]);ptsN.push([t,Vn(t)])}
const path=a=>a.map((p,i)=>(i?'L':'M')+px(p[0]).toFixed(1)+','+py(p[1]).toFixed(1)).join('');
const upTo=(a,t,f)=>path(a.filter(p=>p[0]<=t+1e-9).concat([[t,f(t)]]));
const NC='#0e8f80',MC='#d9253a';
let g=`<rect x="${PX}" y="${PY}" width="${PW}" height="${PH}" rx="12" fill="#fff" stroke="#b9b9b9" stroke-width="1.5"/>`;
g+=`<text x="${PX+20}" y="${PY+32}" style="font-size:21px;font-weight:600">Membrane potential</text>`;
g+=`<text x="${PX+222}" y="${PY+32}" style="font-size:14px;fill:${NC};font-weight:600">● axon terminal</text><text x="${PX+340}" y="${PY+32}" style="font-size:14px;fill:${MC};font-weight:600">● muscle fibre</text>`;
for(const v of[40,20,0,-20,-40,-60,-80,-100]){g+=`<path d="M${X0},${py(v)}H${X1}" stroke="#eee" stroke-width="1"/><text x="${X0-8}" y="${py(v)+5}" text-anchor="end" style="font-size:14px">${mv(v)}</text>`}
for(let t=0;t<=T1;t++)g+=`<path d="M${px(t)},${Y1}v${t%2?4:7}" stroke="#555"/>`+(t%2?'':`<text x="${px(t)}" y="${Y1+24}" text-anchor="middle" style="font-size:14px">${t}</text>`);
g+=`<path d="M${X0},${Y0}V${Y1}H${X1}" fill="none" stroke="#555" stroke-width="1.5"/>`;
g+=`<path d="M${X0},${py(RMP)}H${X1}" stroke="${MC}" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="6 4"/><text x="${X1-4}" y="${py(RMP)-6}" text-anchor="end" style="font-size:13px;fill:${MC}">muscle rest −90</text>`;
g+=`<path d="M${X0},${py(NRMP)}H${X1}" stroke="${NC}" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="6 4"/><text x="${X1-4}" y="${py(NRMP)-6}" text-anchor="end" style="font-size:13px;fill:${NC}">neuron rest −70</text>`;
g+=`<path d="M${X0},${py(THR)}H${X1}" stroke="#1b8a5a" stroke-width="1.3" stroke-dasharray="2 4"/><text x="${X1-4}" y="${py(THR)-6}" text-anchor="end" style="font-size:13px;fill:#1b8a5a">threshold −55</text>`;
g+=`<text x="${(X0+X1)/2}" y="${Y1+44}" text-anchor="middle" style="font-size:15px">time (ms)</text>`;
g+=`<text transform="translate(${PX+22} ${(Y0+Y1)/2}) rotate(-90)" text-anchor="middle" style="font-size:15px">membrane potential (mV)</text>`;
g+=`<path d="${path(ptsM)}" fill="none" stroke="#f1c4c8" stroke-width="2" stroke-dasharray="3 4"/><path d="${path(ptsN)}" fill="none" stroke="#b5ddd7" stroke-width="2" stroke-dasharray="3 4"/>`;
// name the two spikes on the graph: these are the action potentials
g+=`<path d="M${px(.6)},${py(30)}L${px(.44)+2},${py(33)}" stroke="${NC}" stroke-width="1.2"/><text x="${px(.6)+3}" y="${py(30)+4}" style="font-size:12.5px;font-weight:600;fill:${NC}">nerve action potential</text>`;
g+=`<path d="M${px(3.4)},${py(-2)}L${px(2.5)+2},${py(20)}" stroke="${MC}" stroke-width="1.2"/><text x="${px(3.4)+3}" y="${py(-2)+4}" style="font-size:12.5px;font-weight:600;fill:${MC}">muscle action potential</text>`;
// muscle force (relative units, own scale): rises after the action potential, falls during relaxation
// muscle tension (relative): rises after the muscle action potential, falls during relaxation (plotted in its own panel)
const Fm=t=>sm((t-5.35)/2.6)*(1-sm((t-9.7)/1.9));
g+=`<path id="vmTraceN" fill="none" stroke="${NC}" stroke-width="3" stroke-linejoin="round"/><path id="vmTrace" fill="none" stroke="${MC}" stroke-width="3.5" stroke-linejoin="round"/>`;

const hud=$('hud');
// cause → effect chain chips, laid out to fit the caption width
// cause → effect chain chips: a two-row window that follows the current step
const chips=(cw,st=0)=>{const out=[];let x=0,row=0;for(let i=st;i<CHAIN.length;i++){const lab=CHAIN[i][1],w=lab.length*6.3+18;if(x>0&&x+w>cw-32){x=0;row++}if(row>1)break;out.push({i,x,row,w,lab});x+=w+16}return{out,rows:2}};
function captionHeight(){return 96+2*26}
function drawHud(t){let o='';
 LBL.forEach(l=>{const a=win(t,l.a,l.b,.012);if(a<=0)return;
  const [sx,sy]=toScreen(typeof l.p=='function'?l.p(t):l.p),trig=l.k==='trig';const w=l.t.length*(trig?7.6:7.4)+(trig?22:0);
  if(!l.o){o+=`<text x="${sx}" y="${sy}" text-anchor="middle" class="hl" opacity="${a.toFixed(3)}">${l.t}</text>`;return}
  const ty=Math.min(FR.y1-14,Math.max(HB+18,sy+l.o[1])),xr=(ty<PB+12?SW-PWd-30:SW)-w/2-10;let tx=Math.min(xr,Math.max(w/2+10,sx+l.o[0]));
  if(trig){const ly=ty<sy?ty+8:ty-22;
   o+=`<g opacity="${a.toFixed(3)}"><path d="M${tx},${ly}L${sx},${sy}" stroke="#ff9500" stroke-width="2.4"/><circle cx="${sx}" cy="${sy}" r="5" fill="#ff9500" stroke="#fff" stroke-width="1.5"/>`+
    `<rect x="${tx-w/2}" y="${ty-18}" width="${w}" height="26" rx="13" fill="#262626"/><text x="${tx}" y="${ty}" text-anchor="middle" class="ht">${l.t}</text></g>`;return}
  const ly=ty<sy?ty+8:ty-19;
  o+=`<g opacity="${a.toFixed(3)}"><path d="M${tx},${ly}L${sx},${sy}" stroke="#333" stroke-width="1.4"/><circle cx="${sx}" cy="${sy}" r="4" fill="#333" stroke="#fff" stroke-width="1.5"/>`+
   `<text x="${tx}" y="${ty}" text-anchor="middle" class="hl">${l.t}</text></g>`});
 o+=bandLabels(t);
 // caption, bottom-left: cause → effect chain, then what is happening now
 const ph=phase(t),cw=Math.min(SW-24,860),Y=SH-CAPH+6;let cur=-1;CHAIN.forEach((c,i)=>{if(t>=c[0])cur=i});
 const st0=Math.max(0,cur-3),ch=chips(cw,st0);
 o+=`<rect x="12" y="${Y}" width="${cw}" height="${CAPH-16}" rx="10" fill="#fff" fill-opacity=".96" stroke="#bbb"/>`;
 if(cur>=0)o+=`<text x="${cw-2}" y="${Y+12+2*26+18}" text-anchor="end" class="ca" style="font-size:12px">step ${cur+1} of ${CHAIN.length}</text>`;
 ch.out.forEach((c,j)=>{const i=c.i,x=28+c.x,y=Y+12+c.row*26,st=i<cur?'done':i===cur?'now':'next';
  o+=`<rect x="${x}" y="${y}" width="${c.w}" height="20" rx="10" class="c-${st}"/><text x="${x+c.w/2}" y="${y+14}" text-anchor="middle" class="ct-${st}">${i<cur?'✓ ':''}${c.lab}</text>`;
  if(j<ch.out.length-1&&ch.out[j+1].row===c.row)o+=`<text x="${x+c.w+8}" y="${y+14}" text-anchor="middle" class="ca">›</text>`});
 const ty=Y+12+ch.rows*26+18,ln=wrap(ph[1],Math.max(40,Math.floor((cw-40)/7.6)));
 o+=`<text x="28" y="${ty}" class="hc1">${ph[0]}</text>`+ln.slice(0,2).map((s,i)=>`<text x="28" y="${ty+22+i*19}" class="hc2">${s}</text>`).join('');
 hud.innerHTML=o}

/* ---------- play / pause: steps through the whole process automatically ---------- */
const pfo=document.createElementNS(NS,'foreignObject');
pfo.setAttribute('x',PX+PW-222);pfo.setAttribute('y',PY+10);pfo.setAttribute('width',212);pfo.setAttribute('height',34);
pfo.innerHTML=`<div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;gap:6px;justify-content:flex-end;font:600 14px 'Segoe UI',system-ui,sans-serif">
<button id="playBtn" style="font:inherit;padding:4px 14px;border-radius:16px;border:1.5px solid #d9253a;background:#d9253a;color:#fff;cursor:pointer">▶ Play</button>
<select id="speedSel" aria-label="playback speed" style="font:inherit;border-radius:16px;border:1.5px solid #bbb;padding:3px 6px;background:#fff"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>`;
grp.appendChild(pfo);
const RATE=50;   // slider units per second at 1× (the slider warp already slows down where the action is)
let playing=false,lastT=0;
const btn=$('playBtn'),spd=$('speedSel');
function setPlay(on){playing=on;btn.textContent=on?'❚❚ Pause':'▶ Play';if(on){if(+sl.value>=SMAX){sl.value=0}lastT=performance.now();requestAnimationFrame(tick)}}
function tick(now){if(!playing)return;const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
 let v=+sl.value+RATE*(+spd.value)*dt;if(v>=SMAX){v=SMAX;setPlay(false)}sl.value=v;render();if(playing)requestAnimationFrame(tick)}
btn.addEventListener('click',()=>setPlay(!playing));
sl.addEventListener('pointerdown',()=>setPlay(false));
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='SELECT'){e.preventDefault();setPlay(!playing)}});

/* ---------- main ---------- */
function render(){const t=s2t(+sl.value);camera(t);slide(t);drawStory(t);drawHud(t);drawGraph(t);drawTension(t)}
sl.addEventListener('input',render);
addEventListener('resize',()=>{layout();render()});
layout();render();
})();
