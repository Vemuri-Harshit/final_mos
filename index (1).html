<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elbow as a Deformable-Solid System| Mechanics of Solids Project</title>
<!-- Project font: Nunito (soft, rounded, easy on the eyes). Falls back to system fonts when offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== PROJECT PALETTE (reuse these variables on all 7 pages) ===== */
  :root{
    --crimson:#9e1b32;   /* headings, key accents  */
    --red:#c8344a;       /* arrows, buttons        */
    --rose:#e8a5ad;      /* soft highlights        */
    --blush:#fbe9e7;     /* panels                 */
    --cream:#fff8f6;     /* page background        */
    --ink:#3b1a20;       /* body text              */
    --muted:#7a5a60;     /* secondary text         */
    --font:'Nunito','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--font);color:var(--ink);background:var(--cream);overflow:hidden}

  /* soft red blobs + faint muscle-fibre lines, so the glass has something to blur */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;
      background:repeating-linear-gradient(100deg,rgba(158,27,50,.035) 0 2px,transparent 2px 15px),var(--cream)}
  .bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
  .bg i:nth-child(1){width:42vw;height:42vw;left:-10vw;top:-12vw;background:#e8a5ad}
  .bg i:nth-child(2){width:36vw;height:36vw;right:-8vw;top:20vh;background:#d9546a}
  .bg i:nth-child(3){width:40vw;height:30vw;left:30vw;bottom:-14vw;background:#f3c1b8}

  .stage{position:relative;z-index:1;height:100vh;width:100vw}

  /* ===== centre title ===== */
  .hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(56vw,760px);z-index:6}
  /* floating glass structure: pops out on load, then drifts gently. Arrows (z-index 1) pass behind and are blurred by it. */
  .glass{position:relative;padding:clamp(24px,3vw,46px) clamp(22px,3.4vw,56px);border-radius:28px;overflow:hidden;
         background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.8);
         backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
         box-shadow:0 22px 60px rgba(158,27,50,.28),0 4px 14px rgba(158,27,50,.12),inset 0 1px 0 rgba(255,255,255,.95);
         animation:glassPop .9s .15s cubic-bezier(.2,.9,.3,1.25) both,glassFloat 6s 1.1s ease-in-out infinite}
  .glass::after{content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;
         background:linear-gradient(135deg,rgba(255,255,255,.6),transparent 42%)}
  /* intro: everything except the centre glass sits under a blurred layer until the visitor clicks elsewhere */
  #intro{position:absolute;inset:0;z-index:5;cursor:pointer;background:rgba(255,248,246,.32);
         backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);transition:opacity .9s ease,visibility 0s .9s}
  #intro.off{opacity:0;visibility:hidden;pointer-events:none}
  .glass.dissolve{animation:glassDissolve .9s ease forwards}
  @keyframes glassDissolve{from{opacity:1;transform:none;filter:blur(0)}to{opacity:0;transform:scale(1.1);filter:blur(18px)}}
  .hero.gone{visibility:hidden;pointer-events:none}
  /* top-row slides (1,3,5,7): caption above the glass pane */
  .slide.top .tile{display:flex;flex-direction:column-reverse}
  .slide.top .cap{margin:0 0 11px}
  @keyframes glassPop{from{opacity:0;transform:scale(.78) translateY(18px)}to{opacity:1;transform:none}}
  @keyframes glassFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .eyebrow{font-size:clamp(11px,.95vw,14px);letter-spacing:.22em;text-transform:uppercase;color:var(--red);font-weight:700}
  .hero h1{margin:.3em 0 .1em;font-size:clamp(26px,3.7vw,56px);line-height:1.08;font-weight:800;color:var(--crimson);letter-spacing:-.02em}
  .authors{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vw,28px);margin-top:clamp(16px,2vw,26px);padding-top:clamp(12px,1.5vw,20px);
           border-top:1px solid rgba(158,27,50,.22)}
  .authors .nm{font-weight:800;color:var(--crimson);font-size:clamp(13px,1.35vw,19px);line-height:1.25}
  .authors .rn{margin-top:.2em;font-weight:700;color:var(--muted);font-size:clamp(11px,1vw,14px);letter-spacing:.12em}
  .hero p{margin:0;color:var(--muted);font-size:clamp(13px,1.15vw,17px);line-height:1.5}
  .hero .line{width:64px;height:4px;border-radius:4px;margin:14px auto;background:linear-gradient(90deg,var(--crimson),var(--rose))}

  /* ===== arrows ===== */
  #arrows{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;animation:fade 1s .9s both}
  #arrows line{stroke:var(--red);stroke-width:2;stroke-linecap:round;opacity:.75}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ===== glass slides ===== */
  .slide{position:absolute;transform:translate(-50%,-50%);z-index:3}
  .tile{display:block;width:clamp(130px,14vw,210px);background:none;border:0;padding:0;cursor:pointer;font:inherit;
        animation:pop .7s calc(var(--i)*.09s) cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
  .card{position:relative;aspect-ratio:16/10;padding:6px;border-radius:16px;overflow:hidden;
        background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.75);
        backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);
        box-shadow:0 10px 30px rgba(158,27,50,.22),inset 0 1px 0 rgba(255,255,255,.9);
        transition:transform .3s,box-shadow .3s}
  .card::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
        background:linear-gradient(135deg,rgba(255,255,255,.55),transparent 42%)}
  .tile:hover .card,.tile:focus-visible .card{transform:translateY(-5px) scale(1.06);box-shadow:0 18px 40px rgba(158,27,50,.35),inset 0 1px 0 #fff}
  .tile:focus-visible{outline:none}
  .scr{width:100%;height:100%;border-radius:10px;background:#000;overflow:hidden}   /* the black "screenshot" */
  .scr img{width:100%;height:100%;object-fit:cover;display:block}
  .scr{position:relative}
  /* live preview: the real page in an iframe, drawn at 1280x800 and scaled down to fit (scale set by script) */
  .live{position:absolute;left:0;top:0;width:1280px;height:800px;border:0;background:#fff;transform-origin:0 0;pointer-events:none}
  .cap{margin-top:11px;text-align:center;font-weight:700;font-size:clamp(12px,1.05vw,15px);line-height:1.25;color:var(--crimson)}
  .cap b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;margin-right:.45em;border-radius:50%;
         background:var(--crimson);color:#fff;font-size:.85em}

  /* ===== expanded view ===== */
  #ov{position:fixed;inset:0;z-index:10;visibility:hidden;opacity:0;transition:opacity .5s,visibility 0s .5s;
      background:rgba(255,240,238,.35);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
  #ov.on{visibility:visible;opacity:1;transition:opacity .5s}
  #panel{position:fixed;z-index:11;overflow:hidden;cursor:pointer;border-radius:16px;background:#000;
         box-shadow:0 30px 80px rgba(158,27,50,.4);border:1px solid rgba(255,255,255,.6);
         transition:left .65s cubic-bezier(.65,0,.25,1),top .65s cubic-bezier(.65,0,.25,1),width .65s cubic-bezier(.65,0,.25,1),height .65s cubic-bezier(.65,0,.25,1),border-radius .65s}
  #panel .shot{position:absolute;inset:-24px;background:#000;filter:blur(7px)}   /* blurred page preview */
  #panel .shot img{width:100%;height:100%;object-fit:cover}
  #panel .info{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,86%);max-height:86%;overflow:auto;
        padding:clamp(18px,3vw,34px);border-radius:22px;background:rgba(255,248,246,.78);
        backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.85);
        box-shadow:0 20px 60px rgba(60,10,20,.35)}
  .info .rise{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
  #panel.open .rise{opacity:1;transform:none;transition-delay:calc(.45s + var(--d)*.12s)}
  .info .tag{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--red)}
  .info h2{margin:.25em 0 .4em;font-size:clamp(24px,3vw,38px);color:var(--crimson);line-height:1.1}
  .info h3{margin:1.1em 0 .4em;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--crimson)}
  .info p{margin:0;line-height:1.6;color:var(--ink)}
  .info ul{margin:0;padding-left:1.2em;line-height:1.7}
  .info li::marker{color:var(--red)}
  .cta{display:inline-block;margin-top:1.3em;padding:.65em 1.3em;border-radius:999px;background:var(--crimson);color:#fff;font-weight:700}
  #close{position:fixed;top:2.2vh;right:2.2vw;z-index:12;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;
         font-size:22px;color:#fff;background:var(--crimson);opacity:0;visibility:hidden;transition:opacity .4s .5s}
  #ov.on~#close{opacity:1;visibility:visible}

  .hint{position:fixed;z-index:3;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
  @media(max-width:700px){.hero{width:64vw}.tile{width:clamp(60px,17vw,120px)}.cap{font-size:10px}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>

<main class="stage" id="stage">
  <div class="hero"><div class="glass">
    <div class="eyebrow">Mechanics of Solids · Project</div>
    <h1>The Elbow as a Deformable Solid System</h1>
    <div class="line"></div>
    <p>Forces in muscle and bone: a simple model of the human forearm</p>
    <div class="authors">
      <div><div class="nm">Vemuri Harshit</div><div class="rn">ME25BTECH11064</div></div>
      <div><div class="nm">Sumedha R Acharya</div><div class="rn">ME25BTECH11055</div></div>
    </div>
  </div></div>
  <svg id="arrows"></svg>
  <div id="intro" aria-hidden="true"></div>
  <!-- the 8 slides are created here by the script -->
</main>
<div class="hint" id="hint">Click anywhere outside the panel to begin</div>

<div id="ov"></div><div id="panel" style="visibility:hidden"></div><button id="close" aria-label="Close">×</button>

<script>
/* =====================================================================
   PUT YOUR 8 WEBSITE LINKS HERE.
   For each slide:
     title       : the caption shown under the glass slide
     href        : the html file that opens when the expanded view is clicked
                   (a file next to this index.html, e.g. 'forearm_beam.html',
                    or in a folder, e.g. 'pages/page1.html')
     preview     : a picture of that page, e.g. 'img/page1.png'. Leave '' for a black screen.
     desc        : the paragraph shown in the expanded view
     assumptions : the bullet points shown in the expanded view
   ===================================================================== */
const LOREM = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.';
const ASSUME = ['Lorem ipsum dolor sit amet, consectetur adipiscing elit.',
                'Sed do eiusmod tempor incididunt ut labore et dolore.',
                'Ut enim ad minim veniam, quis nostrud exercitation.'];
const SLIDES = [
  { title:'Objectives', href:'page1.html', preview:'', hideAssumptions:true,   // no Assumptions section in the expanded view
    desc:'What this project sets out to do: understand how a muscle produces and grades force, then use Mechanics of Solids (equilibrium, stress and strain, traction and Mohr’s circle, beam theory) to find the forces and stresses in the elbow during a curl.',
    assumptions:['The elbow is studied as a deformable solid system: muscle, bone and joint.',
                 'Each later page states its own simplifying assumptions.',
                 'The last page lists where those assumptions break down.'] },  // <-- link 1
  { title:'Muscle Anatomy & Twitch',href:'glass_page.html', preview:'',
    desc:'We will build the structure of the muscle bottom up from the simplest protein structures. Force generation within a muscle will be shown up from the sarcomere level.',
    assumptions:['Structures, counts and sizes are schematic, not to scale.',
                 'Timing is illustrative: mechanical events are compressed to fit one timeline.',
                 'Sarcomere shortening is exaggerated so it is visible at every scale.'] },  // <-- link 2
  { title:'Temporal Summation and Motor Unit Recruitment', href:'summation_recruitment.html', preview:'',
    desc:'These are the mechanisms used by the brain to control the amount of force generated in the muscle.',
    assumptions:['Every impulse produces the same twitch, and overlapping twitches add up to a fixed maximum.',
                 'Each motor unit is all-or-none, following one passive and one active stress–strain curve.',
                 'Fibres are uniaxial ropes in parallel at equal strain; force sums over the PCSA at constant volume.'] },  // <-- link 3
  { title:'Muscle M.O.S',     href:'muscle_traction_3d_v6.html', preview:'',
    desc:'The muscle as a deformable solid. Cut a loaded muscle with any plane in 3D and see the traction vector t = σ·n, split into its normal and shear parts, with the matching point on Mohr’s circle updating live.',
    assumptions:['Uniaxial stress along the muscle axis: only σₓₓ = F(1 + ε)/(πr²) is non-zero.',
                 'The radius varies along the length as r = c·x(l − x), and muscle volume stays constant as it stretches.',
                 'σₓₓ is the average over each cross-section, shared between recruited and unrecruited fibres.'] },  // <-- link 4
  { title:'Elbow System',         href:'arm_muscle_model_1.html', preview:'',
    desc:'The arm in static equilibrium. From moment balance about the elbow we find the muscle force, its moment arm and the joint reaction as the elbow angle and the load change, and see why the muscle must pull many times the weight in the hand.',
    assumptions:['Static and planar, with rigid rods for the upper arm and forearm.',
                 'The upper arm is fixed and vertical; the elbow is a frictionless pin.',
                 'The muscle is a single straight line from the shoulder to its insertion on the forearm.'] },  // <-- link 5
  { title:'Forearm as a Beam',  href:'forearm_beam_1.html', preview:'',
    desc:'The forearm as a loaded beam. Using the forces from the elbow model, we draw the axial force, shear force and bending moment diagrams along the forearm, and find the normal and shear stresses at any chosen section.',
    assumptions:['The radius and ulna are lumped into one straight prismatic beam.',
                 'Pinned at the elbow and loaded at the hand; the muscle acts as a distributed load near its insertion.',
                 'Linear elastic, isotropic bone with small deflections (Euler–Bernoulli beam theory).'] },  // <-- link 6
  { title:'Curl Variations',      href:'page7_1.html', preview:'',
    desc:'A standing biceps curl and a preacher curl load the same muscle with the same dumbbell, but the upper arm points differently. The standing curl stresses the biceps most in mid-range; the preacher curl stresses it most near full extension, when the muscle is stretched. Training studies suggest that loading the muscle at long lengths, and planned exercise variation, can improve hypertrophy.',
    assumptions:['Quasi-static: no acceleration of the forearm or dumbbell.',
                 'All elbow-flexor force is carried by the biceps; moment arm follows a measured-shape curve.',
                 'Constant muscle volume: area shrinks as the muscle lengthens.'] },  // <-- link 7
  { title:'Deviation from Real Life',        href:'page8.html', preview:'',
    desc:'Our elbow was rods, a frictionless pin, one straight muscle and a weight. Here each simplification breaks away and is replaced by the real anatomy: two forearm bones, a three-part joint, several muscles with elastic tendons, hollow anisotropic bone, viscoelastic muscle, non-uniform shapes and the body’s own limits.',
    assumptions:['Eight of the main simplifications from the elbow, beam and curl models are broken one at a time.',
                 'Effects are described qualitatively; the corrected mathematics is not worked out.',
                 'The aim: see in which direction each assumption moves the model away from the real arm.'] },  // <-- link 8
];
/* ===================================================================== */

const $ = id => document.getElementById(id);
const stage = $('stage'), arrows = $('arrows'), panel = $('panel'), ov = $('ov');
const N = SLIDES.length;
// preview = image if you give one, otherwise a live miniature of the page at `href`
const shot = s => s.preview ? `<img src="${s.preview}" alt="">`
                : s.href ? `<iframe class="live" src="${s.href}" tabindex="-1" scrolling="no" loading="lazy" aria-hidden="true"></iframe>` : '';
// keep every live iframe scaled to the width of the box that holds it (also follows the open/close animation)
const fitter = new ResizeObserver(es => es.forEach(e => {
  const f = e.target.querySelector('.live'); if (f) f.style.transform = `scale(${e.contentRect.width / 1280})`;
}));
const watch = box => { if (box) fitter.observe(box); };

// build the glass slides
const slideEls = SLIDES.map((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide' + (i % 2 === 0 ? ' top' : '');
  el.innerHTML = `<button class="tile" style="--i:${i}" aria-label="${s.title}">
      <div class="card"><div class="scr">${shot(s)}</div></div>
      <div class="cap"><b>${i + 1}</b>${s.title}</div></button>`;
  el.querySelector('.tile').addEventListener('click', () => openSlide(i));
  stage.appendChild(el);
  watch(el.querySelector('.scr'));
  return el;
});

// zig-zag: odd-numbered slides (1,3,5,...) on the top row, even-numbered (2,4,6,...) on the bottom row,
// joined by arrows 1 -> 2 -> 3 -> ... The arrows pass behind the central glass.
const ROW_TOP = .19, ROW_BOT = .81, MARGIN = .1;
function layout() {
  const W = stage.clientWidth, H = stage.clientHeight;
  // slide i sits at an evenly spaced x (so the zig-zag always spans the page, whatever N is); even i on top, odd i below
  slideEls.forEach((el, i) => {
    const x = N > 1 ? MARGIN + i * (1 - 2 * MARGIN) / (N - 1) : .5;
    el.style.left = W * x + 'px';
    el.style.top  = H * (i % 2 === 0 ? ROW_TOP : ROW_BOT) + 'px';
  });
  let h = `<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c8344a"/></marker></defs>`;
  for (let i = 0; i < N - 1; i++) {
    const A = slideEls[i], B = slideEls[i + 1];
    const ax = A.offsetLeft, ay = A.offsetTop, bx = B.offsetLeft, by = B.offsetTop;
    const dx = bx - ax, dy = by - ay;
    const t = Math.min((A.offsetWidth / 2 + 12) / (Math.abs(dx) || 1e-6), (A.offsetHeight / 2 + 12) / (Math.abs(dy) || 1e-6));
    if (t >= .5) continue;                       // slides too close: skip the arrow
    h += `<line x1="${ax + dx * t}" y1="${ay + dy * t}" x2="${bx - dx * t}" y2="${by - dy * t}" marker-end="url(#ah)"/>`;
  }
  arrows.innerHTML = h;
}
layout(); window.addEventListener('resize', layout);

// expanded view: the glass card grows to fill the page, the page behind blurs
let current = -1;
function setRect(r) { Object.assign(panel.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' }); }
function openSlide(i) {
  const s = SLIDES[i]; current = i;
  const r = slideEls[i].querySelector('.card').getBoundingClientRect();
  panel.innerHTML = `<div class="shot">${shot(s)}</div>
    <div class="info">
      <div class="tag rise" style="--d:0">Page ${i + 1} of ${N}</div>
      <h2 class="rise" style="--d:1">${s.title}</h2>
      <p class="rise" style="--d:2">${s.desc}</p>
      ${s.hideAssumptions ? "" : `<h3 class="rise" style="--d:3">Assumptions</h3>
      <ul class="rise" style="--d:4">${s.assumptions.map(a => `<li>${a}</li>`).join("")}</ul>`}
      <span class="cta rise" style="--d:5">Click anywhere to open this page →</span>
    </div>`;
  panel.classList.remove('open'); panel.style.borderRadius = '16px';
  watch(panel.querySelector('.shot'));
  setRect(r); panel.style.visibility = 'visible'; ov.classList.add('on');
  panel.getBoundingClientRect();                                     // force reflow, then animate
  requestAnimationFrame(() => {
    panel.classList.add('open'); panel.style.borderRadius = '26px';
    setRect({ left: innerWidth * .04, top: innerHeight * .05, width: innerWidth * .92, height: innerHeight * .9 });
  });
}
function closeSlide() {
  if (current < 0) return;
  const r = slideEls[current].querySelector('.card').getBoundingClientRect();
  panel.classList.remove('open'); panel.style.borderRadius = '16px'; setRect(r); ov.classList.remove('on'); current = -1;
  setTimeout(() => { if (current < 0) panel.style.visibility = 'hidden'; }, 650);
}
panel.addEventListener('click', () => {            // opens the linked page in a new tab; where pop-ups are blocked, opens it here instead
  if (current < 0) return;
  const href = SLIDES[current].href, w = window.open(href, '_blank');
  if (w) w.opener = null; else location.href = href;
});
$('close').addEventListener('click', e => { e.stopPropagation(); closeSlide(); });
ov.addEventListener('click', closeSlide);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSlide(); });

// intro: only the centre glass is in focus; a click anywhere else dissolves it and reveals the slides
const introEl = $('intro'), heroEl = document.querySelector('.hero'), glassEl = document.querySelector('.glass');
let introDone = false;
function endIntro() {
  if (introDone) return; introDone = true;
  introEl.classList.add('off');
  glassEl.classList.add('dissolve');
  glassEl.addEventListener('animationend', () => heroEl.classList.add('gone'), { once: true });
  $('hint').textContent = 'Click a slide to preview it · Esc to go back';
}
introEl.addEventListener('click', endIntro);
document.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') endIntro(); });
</script>
</body>
</html>
